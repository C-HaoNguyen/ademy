spring.application.name=academic-management-api

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.flyway.enabled=true

server.port=${PORT:8080}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

r2.endpoint=${R2_ENDPOINT:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
r2.bucket-name=${R2_BUCKET_NAME:}
r2.public-base-url=${R2_PUBLIC_BASE_URL:}
r2.presign-expiry-seconds=${R2_PRESIGN_EXPIRY_SECONDS:900}

# "mock" (default) giữ nguyên hành vi /payments/checkout hiện có (SUCCESS ngay, không cần
# credential nào) - "live" bật luồng gateway thật (Phase 21), cần đủ credential bên dưới.
payment.mode=${PAYMENT_MODE:mock}

vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:}

momo.partner-code=${MOMO_PARTNER_CODE:}
momo.access-key=${MOMO_ACCESS_KEY:}
momo.secret-key=${MOMO_SECRET_KEY:}
momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
momo.redirect-url=${MOMO_REDIRECT_URL:}
momo.ipn-url=${MOMO_IPN_URL:}

stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.success-url=${STRIPE_SUCCESS_URL:}
stripe.cancel-url=${STRIPE_CANCEL_URL:}